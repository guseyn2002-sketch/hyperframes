<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>__TITLE__</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        background: #110f31;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #110f31;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #scene svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="12"
    >
      <audio
        id="sound"
        src="sound.wav"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-volume="0.9"
      ></audio>
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <script src="gsap.min.js"></script>
    <script src="lumo-lib.js"></script>
    <script>
      __JS__;
    </script>
  </body>
</html>
